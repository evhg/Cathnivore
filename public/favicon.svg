       app icon/touch-icon PNGs raster off it, all need to agree) of a frozen, static copy of
       shared/cath/cath.ts's cathSvg({framing: "face", outfit: "field", expression: "smirk"})
       output (favicons can't run the module's JS) — regenerate by hand from there if her look
       changes. -->
