<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07080b" />
    <meta name="color-scheme" content="dark" />
    <title>NIGHT SHIFT</title>
    <meta name="description" content="A noir cyberpunk shooter. Cath Hale walks back into Hollowell Proper with a list of names. Rated 18." />
    <link rel="icon" href="/nightshift/favicon.svg" type="image/svg+xml" />
    <meta property="og:title" content="NIGHT SHIFT" />
    <meta property="og:description" content="A noir cyberpunk shooter from cathnivore.com. Rated 18." />
  </head>
  <body>
    <main class="app">
      <!-- C13: the canvas lives under every screen: the title's live street, then the game's. -->
      <canvas id="view"></canvas>
      <div class="front-fallback" id="front-fallback" aria-hidden="true"></div>
      <div class="front-bars" id="front-bars" aria-hidden="true"><i></i><i></i></div>
      <div class="front-grain" id="front-grain" aria-hidden="true"></div>

      <section id="screen-gate" class="screen gate front" aria-labelledby="gate-title" hidden>
        <div class="gate-plate" id="gate-plate">
          <h1 id="gate-title" class="gate-h"><span class="gate-age">18</span> <span class="gate-age-l">For adults only</span></h1>
          <p class="gate-text">NIGHT SHIFT has strong bloody violence and strong language throughout.</p>
          <fieldset class="gate-tiles">
            <legend>Violence</legend>
            <label class="gate-tile"><input type="radio" name="intensity" value="full" checked /> <span class="tile-name">Full</span> <span class="tile-desc">Blood, severed limbs, kill-cams</span></label>
            <label class="gate-tile"><input type="radio" name="intensity" value="reduced" /> <span class="tile-name">Reduced</span> <span class="tile-desc">Hits and falls, no gore</span></label>
          </fieldset>
          <div class="gate-actions">
            <button type="button" id="gate-yes" class="gate-enter">I’m 18 or over</button>
            <a class="gate-back" href="/">Take me back</a>
          </div>
        </div>
      </section>

      <section id="screen-title" class="screen title front" aria-labelledby="title-word" hidden>
        <div class="title-col">
          <!-- The logotype: Bodoni Moda (opsz 11, 700) outlined to paths (C13T), so its hairlines hold at every size and it needs no font. Set at +0.04em (C13T: the old +0.16em read as broken strokes). -->

          <p class="title-sub" id="title-sub">HOLLOWELL PROPER · 2079</p>
          <nav class="menu" id="menu" aria-label="Main menu">
            <button type="button" class="menu-item" id="btn-continue" data-slot="continue"><span class="menu-label">Continue</span></button>
            <button type="button" class="menu-item" id="btn-begin" data-slot="new"><span class="menu-label">New Case</span></button>
            <button type="button" class="menu-item" id="btn-cases" data-slot="cases"><span class="menu-label">Case Board</span></button>
            <button type="button" class="menu-item" id="btn-settings" data-slot="settings"><span class="menu-label">Settings</span></button>
            <button type="button" class="menu-item" id="btn-credits" data-slot="credits"><span class="menu-label">Credits</span></button>
          </nav>
          <p class="menu-hint" id="menu-hint" aria-live="polite"></p>
        </div>
        <section class="the-list" aria-labelledby="the-list-h">
          <h2 id="the-list-h" class="the-list-h">The List</h2>
          <ol class="the-list-names" id="the-list"></ol>
        </section>
        <!-- After the menu in the tab order (Tab from the roving menu lands here); placed top left by CSS. -->
        <a class="front-back" href="/" aria-label="All games">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7" /></svg>
          <span>Games</span>
        </a>
      </section>

      <div class="coldopen" id="coldopen" hidden><div class="coldopen-card"><p class="coldopen-kicker" aria-hidden="true">Night Shift</p><i class="coldopen-rule" aria-hidden="true"></i><p class="coldopen-line" id="coldopen-line"></p></div></div>
      <div class="area-title" id="area-title" role="status" hidden><p class="area-name" id="area-name"></p><p class="area-sub" id="area-sub"></p></div>
      <div class="front-fade" id="front-fade" aria-hidden="true"></div>

      <section id="screen-game" class="screen game" aria-label="NIGHT SHIFT" hidden>
        <div id="hud" class="hud"></div>
        <div id="touch" class="touch" hidden></div>
        <div class="rotate" role="status"><p class="rotate-line">Turn your phone sideways to&nbsp;play.</p></div>
        <div id="loading" class="loading" role="status" aria-label="Loading" hidden></div>
      </section>

      <dialog id="dlg-settings" class="dialog" aria-labelledby="settings-title">
        <h2 id="settings-title">Settings</h2>
        <fieldset>
          <legend>Graphics</legend>
          <label><input type="radio" name="quality" value="auto" checked /> <span>Auto</span></label>
          <label><input type="radio" name="quality" value="phone" /> <span>Fast</span></label>
          <label><input type="radio" name="quality" value="high" /> <span>High</span></label>
          <label><input type="radio" name="quality" value="ultra" /> <span>Ultra</span></label>
        </fieldset>
        <fieldset>
          <legend>Violence</legend>
          <label><input type="radio" name="intensity2" value="full" /> <span>Full</span></label>
          <label><input type="radio" name="intensity2" value="reduced" /> <span>Reduced</span></label>
        </fieldset>
        <fieldset>
          <legend>Reduce motion</legend>
          <label><input type="radio" name="motion" value="auto" checked /> <span>Auto</span></label>
          <label><input type="radio" name="motion" value="on" /> <span>On</span></label>
          <label><input type="radio" name="motion" value="off" /> <span>Off</span></label>
        </fieldset>
        <button type="button" id="settings-close" class="btn btn-primary">Done</button>
        <!-- C13T: the build stamp lives here, not on the front door. -->
        <p class="build-ver" id="build-ver">Build</p>
      </dialog>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
