<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#F4EDE1"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#1C1714"
      media="(prefers-color-scheme: dark)"
    />
    <title>Hedgerow: Cath's tower defence</title>
    <meta
      name="description"
      content="Hold the lane. Build hedgerows and scarecrows to stop the corporations reaching the farmhouse."
    />
    <link rel="icon" href="/hedgerow/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/hedgerow/apple-touch-icon.png" />
    <meta property="og:title" content="Hedgerow" />
    <meta
      property="og:description"
      content="A tower defence game from cathnivore.com."
    />
    <meta
      property="og:image"
      content="https://cathnivore.com/hedgerow/social-preview.png"
    />
  </head>
  <body>
    <div class="app">
      <section id="screen-select" class="screen">
        <header class="top">
          <a class="back" href="/" aria-label="All games">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15 5 8 12l7 7" />
            </svg>
            <span>Games</span>
          </a>
          <h1 class="wordmark">Hedgerow</h1>
          <button class="bank-btn" id="btn-bank" type="button">
            <span aria-hidden="true">★</span> <span id="bank-stars">0</span>
            <span class="bank-word">Seed Bank</span>
          </button>
        </header>
        <section class="host">
          <span class="host-face" id="host-face" aria-hidden="true"></span>
          <p class="host-line" id="host-line">
            They're coming down the lane. Pick a field, and we'll dig in.
          </p>
        </section>
        <ol class="levels" id="levels"></ol>
      </section>

      <section id="screen-play" class="screen play" hidden>
        <header class="hud">
          <button
            class="icon-btn"
            id="btn-levels"
            type="button"
            aria-label="Back to levels"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15 5 8 12l7 7" />
            </svg>
          </button>
          <div class="hud-title">
            <span class="hud-place" id="hud-place"></span>
            <span class="hud-name" id="hud-title">Level 1</span>
          </div>
          <div class="hud-stats">
            <span class="chip chip-heart" title="Goodwill"
              ><svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"
                /></svg
              ><b id="hud-goodwill">10</b
              ><span class="sr-only"> Goodwill</span></span
            >
            <span class="chip chip-coin" title="Marks"
              ><svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="8" />
                <path d="M9.5 9.5h4a1.5 1.5 0 0 1 0 3h-3a1.5 1.5 0 0 0 0 3h4" /></svg
              ><b id="hud-marks">0</b><span class="sr-only"> Marks</span></span
            >
            <span class="chip chip-wave" title="Wave"
              ><svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 19V5l10 4-10 4" /></svg
              ><b id="hud-wave">0/0</b><span class="sr-only"> Wave</span></span
            >
          </div>
          <div class="hud-tools">
            <button
              class="icon-btn"
              id="btn-speed"
              type="button"
              aria-label="Game speed"
              aria-pressed="false"
            >
              x1
            </button>
            <button
              class="icon-btn"
              id="btn-pause"
              type="button"
              aria-pressed="false"
              aria-label="Pause"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 6v12M15 6v12" />
              </svg>
            </button>
            <button
              class="icon-btn"
              id="btn-sound"
              type="button"
              aria-pressed="true"
              aria-label="Sound"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 10v4h4l5 4V6L8 10H4Z" />
                <path class="sound-on" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" />
              </svg>
            </button>
          </div>
        </header>
        <main class="stage" id="stage">
          <canvas
            id="canvas"
            tabindex="0"
            role="application"
            aria-label="Battlefield. Arrow keys move the cursor, Enter selects a plot or sends Cath, C selects Cath, P aims a pie."
          ></canvas>
          <div class="banner" id="banner" aria-hidden="true"></div>
          <div class="banner small" id="toast" aria-hidden="true"></div>
          <div class="bubble" id="bubble" hidden>
            <span class="bubble-face" id="bubble-face"></span>
            <p id="bubble-text"></p>
          </div>
          <div class="intro" id="intro" hidden></div>
          <p class="paused-note" id="paused-note" hidden>Paused</p>
        </main>
        <section class="panel" id="panel" aria-live="polite"></section>
        <footer class="controls">
          <button class="ability" id="btn-hero" type="button" aria-pressed="false">
            <span class="ability-face" id="hero-face" aria-hidden="true"></span>
            <span class="ability-label">Cath</span>
            <span class="ability-hp" aria-hidden="true"><span id="hero-hp"></span></span>
          </button>
          <button class="ability" id="btn-pie" type="button" hidden aria-pressed="false">
            <span class="ability-ring" id="pie-ring" aria-hidden="true"></span>
            <svg class="pie-icon" viewBox="0 0 32 32" aria-hidden="true">
              <ellipse cx="16" cy="19" rx="12" ry="7" fill="#e0b26a" stroke="#2b2320" stroke-width="2"/>
              <ellipse cx="16" cy="16" rx="10" ry="4.5" fill="#fff6e0" stroke="#2b2320" stroke-width="1.5"/>
              <circle cx="16" cy="13" r="2.4" fill="#c4433a" stroke="#2b2320" stroke-width="1.2"/>
            </svg>
            <span class="ability-label" id="pie-label">Pie</span>
          </button>
          <button class="btn send" id="btn-send" type="button">Send wave 1</button>
        </footer>
      </section>
      <p class="sr-only" id="announce" aria-live="polite"></p>
    </div>

    <dialog id="dlg-story" class="sheet story" aria-labelledby="story-who">
      <div class="scene" id="story-scene">
        <div class="scene-bg" id="story-bg" aria-hidden="true"></div>
        <div class="actor left" id="story-left" aria-hidden="true"></div>
        <div class="actor right" id="story-right" aria-hidden="true"></div>
      </div>
      <div class="speech" id="story-speech">
        <p class="eyebrow" id="story-place"></p>
        <h2 id="story-who">Cath</h2>
        <p class="story-text" id="story-text">
          <span class="sr-only" id="story-full"></span
          ><span aria-hidden="true" id="story-typed"></span>
        </p>
      </div>
      <div class="story-actions">
        <button class="btn btn-quiet" type="button" id="story-skip">Skip</button>
        <button class="btn" type="button" id="story-next">Next</button>
      </div>
    </dialog>

    <dialog id="dlg-result" class="sheet win" aria-labelledby="result-title">
      <div class="story-cath" id="result-cath" aria-hidden="true"></div>
      <p class="eyebrow" id="result-eyebrow"></p>
      <h2 id="result-title"></h2>
      <p class="stars" id="result-stars" role="img"></p>
      <p class="result-stats" id="result-stats"></p>
      <p class="story-text" id="result-note"></p>
      <div class="win-actions">
        <button class="btn" type="button" id="result-primary"></button>
        <button class="btn btn-quiet" type="button" id="result-secondary">
          All levels
        </button>
      </div>
    </dialog>

    <dialog id="dlg-bank" class="sheet bank" aria-labelledby="bank-title">
      <p class="eyebrow">Spend your stars</p>
      <h2 id="bank-title">The Seed Bank</h2>
      <p class="bank-free" id="bank-free"></p>
      <ul class="perks" id="perks"></ul>
      <div class="win-actions">
        <button class="btn" type="button" id="bank-close">Done</button>
        <button class="btn btn-quiet" type="button" id="bank-refund">Refund all</button>
      </div>
    </dialog>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
