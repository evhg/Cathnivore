name: iOS

on:
  push:
    tags:
      - 'ios-*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios

      - name: Write App Store Connect API key
        run: |
          mkdir -p private_keys
          echo "${{ secrets.ASC_KEY_P8 }}" > private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      - name: Archive with xcodebuild
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$GITHUB_WORKSPACE/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            archive

      - name: Export and upload to App Store Connect (TestFlight)
        working-directory: ios/App
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$GITHUB_WORKSPACE/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      - name: Delete API key
        if: always()
        run: rm -rf private_keys

      - name: Report status to ci-status
        if: always()
        run: |
          STATUS=${{ job.status }}
          COMMIT=${{ github.sha }}
          TAG=${{ github.ref_name }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin ci-status 2>/dev/null || true
          git checkout ci-status 2>/dev/null || git checkout --orphan ci-status
          mkdir -p status
          if [ "$STATUS" != "success" ]; then
            LOG=$(echo "See workflow run for full logs." | tail -c 4000)
          else
            LOG=""
          fi
          cat > status/ios.json <<EOF
          {
            "workflow": "ios",
            "tag": "$TAG",
            "commit": "$COMMIT",
            "success": $( [ "$STATUS" = "success" ] && echo true || echo false ),
            "buildNumber": "${{ github.run_number }}",
            "time": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "log": "$LOG"
          }
          EOF
          git add status/ios.json
          git commit -m "ios status for $TAG" --allow-empty
          git push --force origin ci-status
