name: CI

on:
  push:
    branches: [build, main]
    # Lock and notes commits change no code: skip them (the repo went public on 2026-10-06 after the
    # private-repo Actions minutes ran out; this keeps runs, and failure emails, to real changes).
    paths-ignore: ["**/*.md", "*.md", ".build-lock", "docs/**"]
  workflow_dispatch:

# A newer push to the same branch supersedes a run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Report status to ci-status
        if: always()
        run: scripts/ci/write-status.sh ci ${{ github.sha }} ${{ job.status }}
