name: Store

on:
  push:
    tags:
      - 'store-*'
      - 'submit-*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false
      - run: gem install fastlane

      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p private_keys
          echo "$ASC_KEY_P8" > "private_keys/AuthKey_${ASC_KEY_ID}.p8"
          # fastlane deliver's api_key_path wants a JSON file bundling key_id/issuer_id/key content,
          # not the bare .p8 path that ios.yml's xcodebuild -authenticationKeyPath flag takes.
          python3 -c "import json, os; key_id = os.environ['ASC_KEY_ID']; key_content = open('private_keys/AuthKey_' + key_id + '.p8').read(); json.dump({'key_id': key_id, 'issuer_id': os.environ['ASC_ISSUER_ID'], 'key': key_content}, open('private_keys/api_key.json', 'w'))"

      - name: Find the latest processed TestFlight build number
        id: build
        run: |
          git fetch origin ci-status
          NUMBER=$(git show origin/ci-status:status/ios.json 2>/dev/null | python3 -c "
          import json, sys
          try:
              data = json.load(sys.stdin)
              print(data['buildNumber'] if data.get('success') else '')
          except Exception:
              print('')
          ")
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          if [ -z "$NUMBER" ]; then
            echo "::warning::No successful ios.yml run found on origin/ci-status; deliver will fall back to the latest processed build App Store Connect has for this version."
          fi

      - name: Upload metadata and screenshots, attach the latest processed build, via fastlane deliver
        env:
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
        run: |
          if [ -f store/Fastfile ]; then
            # `fastlane run <action>` takes `key:value` arguments, not `--flag value` (that syntax is
            # for the standalone `deliver` gem CLI and fails with "invalid option" under `fastlane run`).
            # SPEC 11.6 asks to "attach the latest processed build," not re-upload a binary this job never
            # built itself: ios.yml already exported and uploaded the .ipa to App Store Connect on its own
            # run, so skip_binary_upload here selects that already-processed build by number instead.
            ARGS=(api_key_path:"private_keys/api_key.json" metadata_path:"store/metadata" screenshots_path:"store/screenshots" skip_binary_upload:true app_version:"1.0.0" force:true)
            if [ -n "$BUILD_NUMBER" ]; then
              ARGS+=(build_number:"$BUILD_NUMBER")
            fi
            fastlane run deliver "${ARGS[@]}"
          else
            echo "store/Fastfile not set up yet; skipping upload"
          fi

      - name: Submit for App Review (manual release)
        if: startsWith(github.ref_name, 'submit-')
        run: |
          if [ -f store/Fastfile ]; then
            # Metadata, screenshots and the build were already uploaded by the previous step, so skip
            # re-uploading them here and only flip the app to "submitted for review".
            fastlane run deliver api_key_path:"private_keys/api_key.json" app_version:"1.0.0" \
              skip_metadata:true skip_screenshots:true skip_binary_upload:true \
              submit_for_review:true automatic_release:false force:true
          else
            echo "store/Fastfile not set up yet; skipping submission"
          fi

      - name: Delete API key
        if: always()
        run: rm -rf private_keys

      - name: Report status to ci-status
        if: always()
        run: |
          STATUS=${{ job.status }}
          COMMIT=${{ github.sha }}
          TAG=${{ github.ref_name }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin ci-status 2>/dev/null || true
          git checkout ci-status 2>/dev/null || git checkout --orphan ci-status
          mkdir -p status
          # Stop Vercel building this branch: status pushes were using up the Hobby plan's 100 deployments a day.
          printf '{"git":{"deploymentEnabled":false}}\n' > vercel.json
          git add vercel.json
          cat > status/store.json <<EOF
          {
            "workflow": "store",
            "tag": "$TAG",
            "commit": "$COMMIT",
            "success": $( [ "$STATUS" = "success" ] && echo true || echo false ),
            "time": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git add status/store.json
          git commit -m "store status for $TAG" --allow-empty
          git push --force origin ci-status
