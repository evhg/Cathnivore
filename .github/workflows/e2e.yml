name: E2E

# The release's browser suites, run on GitHub's runners in parallel (owner, 2026-11-15: "speed up the release"):
# the Cathnivore game suite (gate 5) and the whole-site suite in 14 shards (NIGHT SHIFT's 3D specs in 8 of their own) (gate 5, site). The result for each commit
# lands in ci-status as status/e2e/<sha>.json; `npm run release` skips running these suites again locally only when that
# file says they passed on the commit being released (or one that differs from it only in notes). Timing gates (CATHODE perf, Lighthouse, the AI teammate
# under throttling) stay local in the release: shared runners are too uneven to time on.

on:
  push:
    branches: [build]
    paths-ignore: ["**/*.md", "*.md", ".build-lock", ".build-lock-b", "docs/**"]
  workflow_dispatch:

# One run at a time, plus the newest waiting one (GitHub drops older waiting runs; a run in progress always finishes).
# The lanes push code faster than a run takes, so not every commit gets a run: `npm run release` ships the newest
# commit that passed (scripts/gates-e2e.ts newestPassed), and later commits go out in the next release.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # The runner's apt index can go stale (a security pocket 404s, 2026-11-26): refresh and retry before giving up.
      - run: |
          for i in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            sudo apt-get update -q || true
            sleep $((i * 10))
          done
          exit 1
      # Full Chromium, as the sessions run it (/opt/pw-browsers/chromium), not Playwright's default headless shell:
      # the shell lays out and answers hover/pointer queries differently (the first runs failed only here).
      - run: echo "PLAYWRIGHT_CHROMIUM_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      - id: tests
        continue-on-error: true
        run: npx tsx scripts/gates-e2e.ts game
      - name: Leave this shard's outcome for the report
        if: always()
        run: mkdir -p outcome && echo "${{ steps.tests.outcome }}" > outcome/result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outcome-game
          path: outcome/
          retention-days: 2
      - name: Keep the failures' screenshots and page snapshots
        if: steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-game
          path: test-results/
          retention-days: 7

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # NIGHT SHIFT's WebGL specs (about 200, ~10x slower each) shard apart from the rest (about 700).
        include:
          - { group: cathode, shard: 1/8 }
          - { group: cathode, shard: 2/8 }
          - { group: cathode, shard: 3/8 }
          - { group: cathode, shard: 4/8 }
          - { group: cathode, shard: 5/8 }
          - { group: cathode, shard: 6/8 }
          - { group: cathode, shard: 7/8 }
          - { group: cathode, shard: 8/8 }
          - { group: rest, shard: 1/6 }
          - { group: rest, shard: 2/6 }
          - { group: rest, shard: 3/6 }
          - { group: rest, shard: 4/6 }
          - { group: rest, shard: 5/6 }
          - { group: rest, shard: 6/6 }
    env:
      SITE_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # The runner's apt index can go stale (a security pocket 404s, 2026-11-26): refresh and retry before giving up.
      - run: |
          for i in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            sudo apt-get update -q || true
            sleep $((i * 10))
          done
          exit 1
      # Full Chromium, as the sessions run it (/opt/pw-browsers/chromium), not Playwright's default headless shell:
      # the shell lays out and answers hover/pointer queries differently (the first runs failed only here).
      - run: echo "PLAYWRIGHT_CHROMIUM_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      - id: tests
        continue-on-error: true
        run: npx tsx scripts/gates-e2e.ts site ${{ matrix.shard }}
      - name: Leave this shard's outcome for the report
        if: always()
        run: mkdir -p outcome && echo "${{ steps.tests.outcome }}" > outcome/result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outcome-site-${{ matrix.group }}-${{ strategy.job-index }}
          path: outcome/
          retention-days: 2
      - name: Keep the failures' screenshots and page snapshots
        if: steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-site-${{ matrix.group }}-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7

  report:
    needs: [game, site]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: outcome-*
          path: outcomes
      - name: Report status to ci-status
        # The result lives in ci-status (status/e2e/<sha>.json), which the lanes and the release read. The workflow
        # itself always finishes green: the lanes push as the owner's account, and every red run emailed the owner
        # (owner, 2026-11-16: "fix this").
        run: |
          EXPECTED=15
          FOUND=$(ls outcomes 2>/dev/null | wc -l)
          if [ "$FOUND" -lt "$EXPECTED" ]; then echo "only $FOUND of $EXPECTED shards reported (cancelled?)"; exit 0; fi
          OK=success
          if grep -L '^success$' outcomes/*/result | grep -q .; then OK=failure; grep -H . outcomes/*/result; fi
          scripts/ci/write-status.sh e2e ${{ github.sha }} $OK
