name: E2E

# The release's browser suites, run on GitHub's runners in parallel (owner, 2026-11-15: "speed up the release"):
# the Cathnivore game suite (gate 5) and the whole-site suite in 14 shards (NIGHT SHIFT's 3D specs in 8 of their own) (gate 5, site). The result for each commit
# lands in ci-status as status/e2e/<sha>.json; `npm run release` skips running these suites again locally only when that
# file says they passed on the commit being released (or one that differs from it only in notes). Timing gates (CATHODE perf, Lighthouse, the AI teammate
# under throttling) stay local in the release: shared runners are too uneven to time on.

on:
  push:
    branches: [build]
    paths-ignore: ["**/*.md", "*.md", ".build-lock", ".build-lock-b", "docs/**"]
  workflow_dispatch:

# No concurrency group: every code commit gets its own run (a release needs a result for exactly the commit it
# ships, and the lanes push code every few minutes; a group cancelled or replaced nearly every run). Runs past the
# account's runner limit wait for a runner instead.

permissions:
  contents: write

jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Full Chromium, as the sessions run it (/opt/pw-browsers/chromium), not Playwright's default headless shell:
      # the shell lays out and answers hover/pointer queries differently (the first runs failed only here).
      - run: echo "PLAYWRIGHT_CHROMIUM_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      - run: npx tsx scripts/gates-e2e.ts game
      - name: Keep the failures' screenshots and page snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-game
          path: test-results/
          retention-days: 7

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # NIGHT SHIFT's WebGL specs (about 200, ~10x slower each) shard apart from the rest (about 700).
        include:
          - { group: cathode, shard: 1/8 }
          - { group: cathode, shard: 2/8 }
          - { group: cathode, shard: 3/8 }
          - { group: cathode, shard: 4/8 }
          - { group: cathode, shard: 5/8 }
          - { group: cathode, shard: 6/8 }
          - { group: cathode, shard: 7/8 }
          - { group: cathode, shard: 8/8 }
          - { group: rest, shard: 1/6 }
          - { group: rest, shard: 2/6 }
          - { group: rest, shard: 3/6 }
          - { group: rest, shard: 4/6 }
          - { group: rest, shard: 5/6 }
          - { group: rest, shard: 6/6 }
    env:
      SITE_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Full Chromium, as the sessions run it (/opt/pw-browsers/chromium), not Playwright's default headless shell:
      # the shell lays out and answers hover/pointer queries differently (the first runs failed only here).
      - run: echo "PLAYWRIGHT_CHROMIUM_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      - run: npx tsx scripts/gates-e2e.ts site ${{ matrix.shard }}
      - name: Keep the failures' screenshots and page snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-site-${{ matrix.group }}-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7

  report:
    needs: [game, site]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report status to ci-status
        run: |
          # A run superseded by a newer push records nothing.
          if [ "${{ needs.game.result }}" = cancelled ] || [ "${{ needs.site.result }}" = cancelled ]; then exit 0; fi
          OK=failure
          if [ "${{ needs.game.result }}" = success ] && [ "${{ needs.site.result }}" = success ]; then OK=success; fi
          scripts/ci/write-status.sh e2e ${{ github.sha }} $OK
